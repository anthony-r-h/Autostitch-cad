  *{box-sizing:border-box}body{margin:24px auto;padding:0 20px;max-width:1260px;background:#202225;color:#F5F3ED;font:16px Arial,sans-serif}

  <figure><figcaption>Existing GIF</figcaption><img src="emblem-construction.gif" width="600" height="750" alt="The same emblem construction as a GIF"></figure>
